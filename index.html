<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip Clock</title>
<style>
  :root {
    --card-w: 60px; /* fallback - overridden precisely by JS below on load/resize */
    --card-h: calc(var(--card-w) * 2.2);
    --font-size: calc(var(--card-h) * 0.78);

    /* Color customization - overridden by JS from URL params (?bg=...&fg=...) */
    --bg-color: #141414;
    --fg-color: #ffffff;
    --fg-color-dim: #cfcfcf;   /* top-half of digits - computed from fg+bg */
    --label-color: #7a7a7a;    /* AM/PM text - computed from fg+bg */
    --crease-color: rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .clock {
    display: flex;
    gap: calc(var(--card-w) * 0.27);
    align-items: stretch;
  }

  /* One black rounded box per group (hours / minutes). overflow:hidden means
     the two digit-cards inside can be plain rectangles - the box clips
     their corners for us, giving one seamless rounded rectangle. */
  .time-box {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--bg-color);
    border-radius: calc(var(--card-w) * 0.47);
    overflow: hidden;
    padding: calc(var(--card-w) * 0.73) calc(var(--card-w) * 1.07)
             calc(var(--card-w) * 0.73) calc(var(--card-w) * 1.07);
  }

  .ampm-label {
    position: absolute;
    top: calc(var(--card-w) * 0.27);
    left: calc(var(--card-w) * 0.27);
    font-size: calc(var(--card-w) * 0.43);
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--label-color);
    line-height: 1;
  }

  .digits-row {
    display: flex;
    justify-content: center;
  }

  /* One continuous crease line per box, edge-to-edge (spans the padding
     too), instead of a separate short line per card. Box padding-top and
     padding-bottom are equal, so the box's vertical midpoint always lines
     up exactly with the digits' own midpoint. */
  .time-box .box-crease {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 1px;
    background: var(--crease-color);
    z-index: 20;
  }

  .flip-card {
    position: relative;
    width: var(--card-w);
    height: var(--card-h);
    perspective: 300px;
  }

  /* Static halves - always show the CURRENT digit, updated instantly by JS.
     No background of their own - the .time-box behind them provides it. */
  .flip-card .digit {
    position: absolute;
    width: 100%;
    height: 50%;
    font-size: var(--font-size);
    font-weight: 800;
    line-height: var(--card-h);
    text-align: center;
    overflow: hidden;
  }

  .flip-card .digit.top {
    top: 0;
    color: var(--fg-color-dim);
  }

  .flip-card .digit.bottom {
    bottom: 0;
    color: var(--fg-color);
  }

  .flip-card .digit span {
    position: absolute;
    left: 0;
    width: 100%;
    text-align: center;
    line-height: var(--card-h);
  }

  .flip-card .digit.top span { top: 0; }
  .flip-card .digit.bottom span { top: calc(var(--card-h) / -2); }

  /* subtle per-digit crease line, not a full-width divider */
  /* Flaps - the pieces that physically rotate. JS controls their transform directly. */
  .flip-card .flap {
    position: absolute;
    width: 100%;
    height: 50%;
    left: 0;
    font-size: var(--font-size);
    font-weight: 800;
    overflow: hidden;
    z-index: 10;
    backface-visibility: hidden;
    background: var(--bg-color);
  }

  .flap span {
    position: absolute;
    left: 0;
    width: 100%;
    text-align: center;
    line-height: var(--card-h);
  }

  .flap.top-flap {
    top: 0;
    color: var(--fg-color-dim);
    transform-origin: bottom;
    transform: rotateX(0deg);
    transition: transform 0.3s ease-in;
  }

  .flap.bottom-flap {
    top: 50%;
    color: var(--fg-color);
    transform-origin: top;
    transform: rotateX(90deg);
    transition: transform 0.3s ease-out;
  }

  .flap.bottom-flap span { top: calc(var(--card-h) / -2); }

  .no-transition {
    transition: none !important;
  }
</style>
</head>
<body>

<div class="clock" id="clock"></div>

<script>
  // --- Color customization from URL params (?bg=1a1a2e&fg=ffcc00) ---
  function hexToRgb(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    const num = parseInt(hex, 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }

  function mix(hexA, hexB, weightA) {
    const a = hexToRgb(hexA), b = hexToRgb(hexB);
    const r = Math.round(a.r * weightA + b.r * (1 - weightA));
    const g = Math.round(a.g * weightA + b.g * (1 - weightA));
    const bl = Math.round(a.b * weightA + b.b * (1 - weightA));
    return `rgb(${r}, ${g}, ${bl})`;
  }

  (function applyColorsFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const bgParam = params.get('bg');
    const fgParam = params.get('fg');
    const creaseParam = params.get('crease');

    // Only override if the params are present and look like valid hex
    const isHex = v => v && /^[0-9a-fA-F]{3}$|^[0-9a-fA-F]{6}$/.test(v);

    const bg = isHex(bgParam) ? '#' + bgParam.replace('#', '') : '#141414';
    const fg = isHex(fgParam) ? '#' + fgParam.replace('#', '') : '#ffffff';

    const root = document.documentElement.style;
    root.setProperty('--bg-color', bg);
    root.setProperty('--fg-color', fg);
    root.setProperty('--fg-color-dim', mix(fg, bg, 0.65));   // dimmer top-half
    root.setProperty('--label-color', mix(fg, bg, 0.45));    // muted AM/PM

    // Crease line: use the explicit color if provided, otherwise
    // auto-compute a subtle darker shade of the background (default).
    const crease = isHex(creaseParam) ? '#' + creaseParam.replace('#', '') : mix('#000000', bg, 0.22);
    root.setProperty('--crease-color', crease);
  })();

  const clock = document.getElementById('clock');
  const groups = ['hh', 'mm'];
  const state = {};

  function buildBox(id, withLabel) {
    const box = document.createElement('div');
    box.className = 'time-box';
    box.id = id;

    if (withLabel) {
      const label = document.createElement('div');
      label.className = 'ampm-label';
      label.id = 'ampm-label';
      label.textContent = 'AM';
      box.appendChild(label);
    }

    const boxCrease = document.createElement('div');
    boxCrease.className = 'box-crease';
    box.appendChild(boxCrease);

    const row = document.createElement('div');
    row.className = 'digits-row';

    for (let i = 0; i < 2; i++) {
      const card = document.createElement('div');
      card.className = 'flip-card';
      card.innerHTML = `
        <div class="digit top"><span>0</span></div>
        <div class="digit bottom"><span>0</span></div>
        <div class="flap top-flap"><span>0</span></div>
        <div class="flap bottom-flap"><span>0</span></div>
      `;
      row.appendChild(card);
    }
    box.appendChild(row);
    return box;
  }

  groups.forEach((g, idx) => {
    clock.appendChild(buildBox(g, idx === 0));
    state[g] = ['00', '00'];
  });

  function snap(el, transformValue) {
    el.classList.add('no-transition');
    el.style.transform = transformValue;
    void el.offsetHeight;
    el.classList.remove('no-transition');
  }

  function setDigit(cardEl, newVal, oldVal) {
    if (newVal === oldVal) return;

    const topSpan = cardEl.querySelector('.digit.top span');
    const bottomSpan = cardEl.querySelector('.digit.bottom span');
    const topFlap = cardEl.querySelector('.flap.top-flap');
    const bottomFlap = cardEl.querySelector('.flap.bottom-flap');
    const topFlapSpan = topFlap.querySelector('span');
    const bottomFlapSpan = bottomFlap.querySelector('span');

    topSpan.textContent = newVal;
    topFlap.style.transform = 'rotateX(-90deg)';

    setTimeout(() => {
      topFlapSpan.textContent = newVal;
      snap(topFlap, 'rotateX(0deg)');

      bottomFlapSpan.textContent = newVal;
      bottomFlap.style.transform = 'rotateX(0deg)';

      setTimeout(() => {
        bottomSpan.textContent = newVal;
        snap(bottomFlap, 'rotateX(90deg)');
      }, 300);
    }, 300);
  }

  function updateUnit(id, valueStr) {
    const unit = document.getElementById(id);
    const cards = unit.querySelectorAll('.flip-card');
    const digits = valueStr.split('');
    const old = state[id];

    digits.forEach((d, i) => {
      if (d !== old[i]) {
        setDigit(cards[i], d, old[i]);
      }
    });
    state[id] = digits;
  }

  function pad(n) { return n.toString().padStart(2, '0'); }

  function tick() {
    const now = new Date();
    let h = now.getHours() % 12;
    if (h === 0) h = 12;
    updateUnit('hh', pad(h));
    updateUnit('mm', pad(now.getMinutes()));

    const label = document.getElementById('ampm-label');
    label.textContent = now.getHours() >= 12 ? 'PM' : 'AM';
  }

  (function init() {
    const now = new Date();
    let h = now.getHours() % 12;
    if (h === 0) h = 12;
    const hh = pad(h).split('');
    const mm = pad(now.getMinutes()).split('');
    const map = { hh, mm };

    ['hh', 'mm'].forEach(id => {
      const unit = document.getElementById(id);
      const cards = unit.querySelectorAll('.flip-card');
      map[id].forEach((d, i) => {
        cards[i].querySelector('.digit.top span').textContent = d;
        cards[i].querySelector('.digit.bottom span').textContent = d;
        cards[i].querySelector('.flap.top-flap span').textContent = d;
        cards[i].querySelector('.flap.bottom-flap span').textContent = d;
      });
      state[id] = map[id];
    });

    document.getElementById('ampm-label').textContent = now.getHours() >= 12 ? 'PM' : 'AM';
  })();

  setInterval(tick, 1000);

  // Precisely size the clock so it always fills the available width, exactly.
  // Total rendered width = 8.55 * --card-w (derived from the gap/padding
  // multipliers used throughout the CSS: 2 boxes x [2 cards + 2x1.07 padding]
  // + 1 inter-box gap of 0.27). We solve that equation backwards: given the
  // width we actually have, compute exactly the --card-w that fills it.
  function resizeClock() {
    const availableWidth = document.documentElement.clientWidth; // fills 100% of width, no margin
    const availableHeight = document.documentElement.clientHeight;

    // Total clock width = 8.55 x --card-w, total height = 3.66 x --card-w
    // (same ratios used throughout). Whichever dimension is tighter wins,
    // so the clock can never be clipped in either direction - this trades
    // away guaranteed full-width fill in exchange for guaranteed no clipping,
    // which matters most on mobile where the person can't manually resize
    // the embed block to compensate the way they can on desktop.
    const cardWFromWidth = availableWidth / 8.55;
    const cardWFromHeight = availableHeight / 3.66;
    let cardW = Math.min(cardWFromWidth, cardWFromHeight);

    cardW = Math.max(18, Math.min(cardW, 160)); // sane safety bounds
    document.documentElement.style.setProperty('--card-w', cardW + 'px');
  }

  window.addEventListener('resize', resizeClock);
  resizeClock();
</script>

</body>
</html>
