<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Customize Your Flip Clock</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #0d0d0d;
    color: #eaeaea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 40px 24px 60px 24px;
  }

  h1 {
    font-size: 22px;
    margin: 0 0 6px 0;
  }

  p.sub {
    color: #999;
    margin: 0 0 32px 0;
    font-size: 14px;
  }

  .preview-box {
    background: #000;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 28px;
    display: flex;
    justify-content: center;
  }

  .preview-box iframe {
    width: 100%;
    height: 140px;
    border: none;
    display: block;
  }

  .controls {
    display: flex;
    gap: 24px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .control {
    flex: 1;
    min-width: 180px;
    background: #171717;
    border-radius: 12px;
    padding: 16px;
  }

  .control label {
    display: block;
    font-size: 13px;
    color: #aaa;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .control input[type="color"] {
    width: 100%;
    height: 44px;
    border: none;
    border-radius: 8px;
    background: none;
    cursor: pointer;
    padding: 0;
  }

  .control .hex {
    margin-top: 8px;
    font-size: 12px;
    color: #777;
    font-family: 'Courier New', monospace;
  }

  .link-section {
    background: #171717;
    border-radius: 12px;
    padding: 18px;
  }

  .link-section label {
    display: block;
    font-size: 13px;
    color: #aaa;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .link-row {
    display: flex;
    gap: 8px;
  }

  .link-row input {
    flex: 1;
    background: #0d0d0d;
    border: 1px solid #333;
    border-radius: 8px;
    color: #eaeaea;
    padding: 10px 12px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
  }

  .link-row button {
    background: #eaeaea;
    color: #111;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
  }

  .link-row button:active {
    transform: scale(0.97);
  }

  .link-row button.copied {
    background: #4ade80;
  }

  .instructions {
    margin-top: 24px;
    font-size: 13px;
    color: #888;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>Customize Your Flip Clock</h1>
  <p class="sub">Pick your colors, copy the link, paste it into Notion's <code>/embed</code> block.</p>

  <div class="preview-box">
    <iframe id="preview" title="Förhandsvisning"></iframe>
  </div>

  <div class="controls">
    <div class="control">
      <label for="bgPicker">Background color</label>
      <input type="color" id="bgPicker" value="#141414">
      <div class="hex" id="bgHex">#141414</div>
    </div>
    <div class="control">
      <label for="fgPicker">Numbers &amp; text</label>
      <input type="color" id="fgPicker" value="#ffffff">
      <div class="hex" id="fgHex">#ffffff</div>
    </div>
  </div>

  <div class="link-section">
    <label>Your personal embed link</label>
    <div class="link-row">
      <input type="text" id="generatedLink" readonly>
      <button id="copyBtn">Copy</button>
    </div>
  </div>

  <div class="instructions">
    1. Pick your colors above &nbsp;→&nbsp; 2. Click "Copy" &nbsp;→&nbsp;
    3. In Notion: type <code>/embed</code>, paste the link.
  </div>
</div>

<script>
  const bgPicker = document.getElementById('bgPicker');
  const fgPicker = document.getElementById('fgPicker');
  const bgHex = document.getElementById('bgHex');
  const fgHex = document.getElementById('fgHex');
  const preview = document.getElementById('preview');
  const generatedLink = document.getElementById('generatedLink');
  const copyBtn = document.getElementById('copyBtn');

  // Resolves to index.html in the same folder as this page, on whatever
  // domain this configurator is actually hosted on - no hardcoded URL needed.
  // Uses plain string replacement (not the URL constructor) because the
  // URL constructor throws in some sandboxed preview contexts where
  // window.location.href isn't a standard absolute URL.
  function clockBaseUrl() {
    try {
      return window.location.href.replace(/[^\/]*$/, 'index.html');
    } catch (e) {
      return 'index.html';
    }
  }

  function buildUrl() {
    const bg = bgPicker.value.replace('#', '');
    const fg = fgPicker.value.replace('#', '');
    return `${clockBaseUrl()}?bg=${bg}&fg=${fg}`;
  }

  function update() {
    bgHex.textContent = bgPicker.value;
    fgHex.textContent = fgPicker.value;
    const url = buildUrl();
    generatedLink.value = url;
    preview.src = url;
  }

  bgPicker.addEventListener('input', update);
  fgPicker.addEventListener('input', update);

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(generatedLink.value);
      copyBtn.textContent = 'Copied!';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = 'Copy';
        copyBtn.classList.remove('copied');
      }, 1800);
    } catch (e) {
      // Fallback for browsers/contexts blocking clipboard API
      generatedLink.select();
      document.execCommand('copy');
    }
  });

  update();
</script>

</body>
</html>
